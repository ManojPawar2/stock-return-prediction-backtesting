name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        # The suite is fully offline — every test that touches market data
        # monkeypatches the download. A network failure here would be a real
        # regression, not flakiness.
        run: pytest -q

      - name: Verify a cold start needs no network
        # The deployed app must serve from the committed rolling cache. This
        # blocks the downloader outright and boots every page; if any page
        # tries to reach Yahoo, the build fails.
        run: |
          python - <<'PY'
          import sys, warnings
          warnings.filterwarnings("ignore")
          sys.path.insert(0, ".")

          from src import data_loader as dl
          def blocked(*a, **k):
              raise AssertionError("page attempted a network download")
          dl._download = blocked

          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          scripts = [Path("app.py")] + sorted(Path("pages").glob("*.py"))
          failures = []
          for script in scripts:
              app = AppTest.from_file(str(script), default_timeout=600)
              app.run()
              if app.exception:
                  failures.append(f"{script.name}: {app.exception[0].message}")
              else:
                  print(f"OK   {script.name}")

          if failures:
              print("\nCOLD START FAILURES:")
              for f in failures:
                  print(" ", f)
              sys.exit(1)
          print(f"\nAll {len(scripts)} pages served offline.")
          PY
